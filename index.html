<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arsenal — Trade State</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#070a10">
<meta name="apple-mobile-web-app-title" content="Arsenal">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<style>
  :root{
    --bg:#070a10; --panel:#0e131c; --panel2:#141b27; --line:#20293a;
    --ink:#eaf0fa; --dim:#8b98ad; --faint:#5f6b7e;
    --pos:#12351f; --pos-ink:#5bd98a; --neg:#3a1418; --neg-ink:#ff7a86;
    --warn:#3a2f10; --warn-ink:#ffcf5b; --info:#122a3a; --info-ink:#5bc4ff;
    --idle:#1b2230; --idle-ink:#9aa7bc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;overflow-x:hidden}
  .wrap{max-width:680px;margin:0 auto;padding:12px 12px 64px}
  h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
    margin:0 0 2px;font-weight:700}
  .sub{color:var(--faint);font-size:12px;margin-bottom:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 14px 12px;margin:10px 0}
  .card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);margin:0 0 8px;font-weight:700}
  .big{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
  .huge{font-size:38px;font-weight:800;line-height:1.05}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:6px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .k{color:var(--dim);font-size:13px}
  .row .v{font-size:17px;font-weight:600;text-align:right}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:13px;font-weight:700;white-space:nowrap}
  .pos{background:var(--pos);color:var(--pos-ink)}
  .neg{background:var(--neg);color:var(--neg-ink)}
  .warn{background:var(--warn);color:var(--warn-ink)}
  .info{background:var(--info);color:var(--info-ink)}
  .idle{background:var(--idle);color:var(--idle-ink)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .tile .t{color:var(--dim);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .tile .n{font-size:22px;font-weight:800;margin-top:2px}
  .stale{color:var(--warn-ink);font-weight:700}
  .dark{color:var(--neg-ink);font-weight:700}
  .muted{color:var(--faint);font-size:12px}
  .banner{border-radius:12px;padding:10px 12px;font-weight:700;margin:8px 0;font-size:14px}
  .b-warn{background:var(--warn);color:var(--warn-ink)}
  .b-neg{background:var(--neg);color:var(--neg-ink)}
  .b-pos{background:var(--pos);color:var(--pos-ink)}
  .lvl{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--line)}
  .lvl:first-child{border-top:0}
  .lvl .p{font-weight:700;font-variant-numeric:tabular-nums}
  .lvl .d{color:var(--dim);font-size:12px}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none}
  summary::-webkit-details-marker{display:none}
  .fresh-board{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
  .fb{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .d-live{background:var(--pos-ink)} .d-stale{background:var(--warn-ink)} .d-dark{background:var(--neg-ink)}
  a{color:var(--info-ink)}
  .err{color:var(--neg-ink);padding:20px;text-align:center}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="muted">Loading trade_state.json…</div>
</div>

<script>
/* Mobile render of trade_state.json — the ONE source. No decision logic here;
   this only renders what the aggregator published, honesty tags and all. */
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const num = v => (v == null || v === '' ) ? '—' : (typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(2)) : v);

/* unwrap a {value,render,status,age_s} envelope into a display string + class */
function disp(x){
  if (x == null) return {txt:'—', cls:'muted'};
  if (typeof x === 'object' && 'render' in x){
    if (x.status === 'DARK') return {txt:'DARK', cls:'dark', age:x.age_s};
    if (x.status === 'STALE') return {txt:(typeof x.render==='string'?x.render:'STALE'), cls:'stale', age:x.age_s};
    return {txt:num(x.value), cls:'', age:x.age_s};
  }
  return {txt:num(x), cls:''};
}
function envOf(x){ return (x && typeof x==='object' && 'status' in x) ? x : null; }

function statusChip(s){
  const m = {PASS:'pos', FAIL:'neg', UNRELIABLE:'warn', QUALIFIED:'pos',
             ARMED:'info', BLOCKED:'idle', LIVE:'pos', STALE:'warn', DARK:'neg',
             CLOSED:'idle', 'PRE':'idle'};
  const icon = {PASS:'✓',FAIL:'✗',UNRELIABLE:'◉',QUALIFIED:'✓',ARMED:'●',
                BLOCKED:'—',LIVE:'●',STALE:'◉',DARK:'✗'};
  return `<span class="chip ${m[s]||'idle'}">${icon[s]||''} ${esc(s||'—')}</span>`;
}

function ageStr(s){
  if (s == null) return '';
  if (s >= 86400) return Math.floor(s/86400)+'d';
  if (s >= 3600) return Math.floor(s/3600)+'h';
  if (s >= 60) return Math.floor(s/60)+'m';
  return s+'s';
}

function render(d){
  const app = document.getElementById('app');
  app.innerHTML = '';

  /* header */
  app.append(el('h1', null, 'Arsenal — Trade State'));
  const fresh = d.freshness || {};
  const nDark = Object.values(fresh).filter(f=>f.status==='DARK').length;
  const nStale = Object.values(fresh).filter(f=>f.status==='STALE').length;
  app.append(el('div','sub', `${esc(d.session_date||'—')} · phase ${esc(d.phase||'—')} · `
    + `<code>ref: newest feed</code>`));

  /* WALL-CLOCK heartbeat banner — the loudest, and the one the anchored
     board cannot raise. On a total freeze every feed anchors to the same
     frozen "newest" and the board below reads LIVE; this reads real time. */
  const hb = d.heartbeat || {};
  if (hb.mirror_status === 'STALE' || hb.mirror_status === 'DARK'){
    const g = hb.guard || {};
    const hbb = el('div', 'banner b-neg');
    const sev = g.escalation ? ` [${g.escalation}]` : '';
    const brk = (hb.internals && hb.internals.push_is_the_break)
      ? ' — local writes ahead of last push: the PUSH is the break'
      : '';
    hbb.innerHTML = `⛔ MIRROR ${esc(hb.mirror_status)}${sev} — newest row `
      + `${esc(hb.mirror_age_hms||ageStr(hb.mirror_age_s))} old vs wall clock`
      + `${esc(brk)}. The feed board below is anchored and can read LIVE while `
      + `frozen — trust this line.`;
    app.append(hbb);
  }

  /* one loud honesty banner */
  if (nDark || nStale){
    const b = el('div', 'banner ' + (nDark? 'b-neg':'b-warn'));
    b.innerHTML = (nDark? `⚠ ${nDark} feed${nDark>1?'s':''} DARK` : '')
      + (nDark && nStale ? ' · ' : '')
      + (nStale? `${nStale} STALE` : '')
      + ' — values below are tagged, not silently trusted.';
    app.append(b);
  }

  /* DAY TYPE + GATES */
  const c1 = el('div','card');
  c1.append(el('h2',null,'Day Type · Gates'));
  const cls = d.classification||{};
  const dt = el('div');
  if (cls.day_type){
    dt.append(el('div','huge', esc(cls.day_type)));
    if (cls.evaluated_at) dt.append(el('div','muted','evaluated '+esc(cls.evaluated_at)));
  } else {
    dt.append(el('div','big', '<span class="chip warn">◉ UNCLASSIFIED</span>'));
    dt.append(el('div','muted', esc(cls.unclassified_reason||'')));
  }
  c1.append(dt);
  const g = d.gates||{};
  const gl = el('div','grid2'); gl.style.marginTop='10px';
  gl.append(el('div','tile', `<div class="t">Long gate</div><div class="n">${statusChip(g.long)}</div>`));
  gl.append(el('div','tile', `<div class="t">Short gate</div><div class="n">${statusChip(g.short)}</div>`));
  c1.append(gl);
  if (g.unreliable_reason) c1.append(el('div','muted', 'gate: '+esc(g.unreliable_reason)));
  const gd = el('details');
  gd.innerHTML = `<summary>slope inputs</summary>`
    + `<div class="row"><span class="k">add slope</span><span class="v">${num(g.add_slope)}</span></div>`
    + `<div class="row"><span class="k">vold slope</span><span class="v">${num(g.vold_slope)}</span></div>`
    + `<div class="row"><span class="k">trin slope</span><span class="v">${num(g.trin_slope)}</span></div>`
    + `<div class="row"><span class="k">magnitude floor</span><span class="v">${num(g.magnitude_floor_pct)}%</span></div>`;
  c1.append(gd);
  app.append(c1);

  /* RISK */
  const r = d.risk||{};
  const c2 = el('div','card');
  c2.append(el('h2',null,'Risk'));
  const atr = disp(r.atr_15m);
  const t = el('div','grid2');
  t.append(el('div','tile', `<div class="t">ATR (15m)</div><div class="n ${atr.cls}">${atr.txt}</div>`));
  t.append(el('div','tile', `<div class="t">Min stop</div><div class="n">${num(r.min_stop)}</div>`));
  t.append(el('div','tile', `<div class="t">Min R:R</div><div class="n">${num(r.min_rr)}</div>`));
  t.append(el('div','tile', `<div class="t">Size</div><div class="n" style="font-size:16px">${esc(r.size||'—')}</div>`));
  c2.append(t);
  const oneLoss = r.one_loss_done ? '<span class="chip neg">✗ STOP — loss limit hit</span>'
                                  : '<span class="chip pos">✓ within limits</span>';
  c2.append(el('div',null, `<div class="row"><span class="k">trades today / max</span><span class="v">${num(r.trades_today)} / ${num(r.max_trades)}</span></div>`
    + `<div class="row"><span class="k">flat by</span><span class="v">${esc(r.flat_by||'—')}</span></div>`
    + `<div class="row"><span class="k">status</span><span class="v">${oneLoss}</span></div>`));
  if (r.atr_5m && r.atr_5m.reason) c2.append(el('div','muted','atr_5m: '+esc(r.atr_5m.reason)));
  app.append(c2);

  /* LEVELS */
  const lv = d.levels||{};
  const c3 = el('div','card');
  c3.append(el('h2',null,'Levels'));
  const vah=disp(lv.vah), poc=disp(lv.poc), val=disp(lv.val);
  const vp = el('div','grid2');
  vp.append(el('div','tile',`<div class="t">VAH</div><div class="n ${vah.cls}">${vah.txt}</div>`));
  vp.append(el('div','tile',`<div class="t">VAL</div><div class="n ${val.cls}">${val.txt}</div>`));
  c3.append(vp);
  c3.append(el('div','tile',`<div class="t" style="margin-top:8px">POC</div><div class="n ${poc.cls}">${poc.txt}</div>`));
  const pools = (arr,label)=>{
    if (!arr || !arr.length) return;
    c3.append(el('div','muted',`<div style="margin-top:10px;text-transform:uppercase;letter-spacing:.06em">${label}</div>`));
    arr.forEach(p=>c3.append(el('div','lvl',
      `<span class="p">${num(p.price)}</span><span class="d">${esc(p.kind||'')} · ${p.dist>0?'+':''}${num(p.dist)}</span>`)));
  };
  pools(lv.pools_above,'Pools above');
  pools(lv.pools_below,'Pools below');
  /* newsletter */
  const nl = lv.newsletter||{};
  const nd = el('details');
  let nlh = '<summary>newsletter levels</summary>';
  const tammy = nl.tammy && nl.tammy.value;
  const tt = nl.tic_toc && nl.tic_toc.value;
  if (tammy && tammy.levels) nlh += `<div class="muted" style="margin-top:6px"><b>Tammy</b> (${esc((tammy.as_of||'').slice(0,16))}): `
     + tammy.levels.map(x=>`${num(x.level)} ${esc(x.role||'')}`).join(' · ')+'</div>';
  if (tt && tt.levels) nlh += `<div class="muted" style="margin-top:6px"><b>Tic Toc</b>: `
     + tt.levels.map(x=>`${num(x.level)} ${esc(x.role||'')}`).join(' · ')+'</div>';
  nd.innerHTML = nlh; c3.append(nd);
  app.append(c3);

  /* CARDS */
  const c4 = el('div','card');
  c4.append(el('h2',null,'Setup Cards'));
  (d.cards||[]).forEach(card=>{
    const row = el('div'); row.style.padding='8px 0'; row.style.borderTop='1px solid var(--line)';
    row.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">`
      + `<span style="font-weight:700;font-size:15px">${esc(card.name)}</span>${statusChip(card.status)}</div>`;
    if (card.blocking_reason) row.innerHTML += `<div class="muted" style="margin-top:3px">${esc(card.blocking_reason)}</div>`;
    const p = card.proposed;
    if (p && (p.entry!=null)) row.innerHTML += `<div class="muted" style="margin-top:3px">`
      + `entry ${num(p.entry)} · stop ${num(p.stop)} · t1 ${num(p.t1)} · t2 ${num(p.t2)} · rr ${num(p.rr)}</div>`;
    c4.append(row);
  });
  app.append(c4);

  /* CONTEXT + CALENDAR */
  const cx = d.context||{}, cal = d.calendar||{};
  const c5 = el('div','card');
  c5.append(el('h2',null,'Context · Calendar'));
  const nyad = disp(cx.nyad_cum), vix = disp(cx.vix);
  c5.append(el('div',null,
      `<div class="row"><span class="k">VIX</span><span class="v ${vix.cls}">${vix.txt}</span></div>`
    + `<div class="row"><span class="k">NYAD cum</span><span class="v ${nyad.cls}">${nyad.txt}</span></div>`
    + `<div class="row"><span class="k">NYAD vs ATH</span><span class="v">${num((cx.nyad_vs_ath||{}).value)}</span></div>`
    + `<div class="row"><span class="k">breadth gate</span><span class="v">${esc(cx.breadth_gate||'—')}</span></div>`
    + `<div class="row"><span class="k">NYSE</span><span class="v">${esc(cal.nyse_status||'—')}</span></div>`
    + `<div class="row"><span class="k">next event</span><span class="v" style="font-size:13px">${esc(cal.next_event||'—')}</span></div>`));
  app.append(c5);

  /* FRESHNESS BOARD */
  const c6 = el('div','card');
  c6.append(el('h2',null,'Freshness'));
  const fb = el('div','fresh-board');
  Object.entries(fresh).forEach(([k,v])=>{
    const dc = v.status==='LIVE'?'d-live':v.status==='STALE'?'d-stale':'d-dark';
    fb.append(el('div','fb',
      `<span><span class="dot ${dc}"></span>${esc(k)}</span><span class="muted">${v.status==='DARK'?'DARK':ageStr(v.age_s)}</span>`));
  });
  c6.append(fb);
  app.append(c6);

  /* footer */
  const f = el('div','muted');
  f.style.marginTop='14px';
  f.innerHTML = `Generated ${esc((d.generated_at||'').slice(0,19))} · `
    + `<a href="./dashboard_full.html">full dashboard →</a>`;
  app.append(f);
  if (d.provenance_note) app.append(el('div','muted', esc(d.provenance_note)));
}

fetch('./trade_state.json?_=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      '<div class="err">Could not load <code>trade_state.json</code><br>'+esc(e.message)+'</div>';
  });
</script>
</body>
</html>
