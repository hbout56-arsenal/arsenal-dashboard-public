<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arsenal — Trader Trainer</title>
<style>
:root{--bg:#0b0f17;--ink:#eef3fb;--mut:#8b97ab;--dim:#5a6678;--line:rgba(255,255,255,.08);--gbrd:rgba(255,255,255,.12);
--pos-ink:#7ee0a6;--neg-ink:#e06060;--warn-ink:#ffd98a;--info-ink:#9cc3ff;--card:rgba(255,255,255,.02);}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:0 0 50px}
.hd{padding:11px 12px 4px}.hd h1{font-size:17px;margin:0}.hd .sub{font-size:11px;color:var(--mut)}
.hd a{color:var(--info-ink);text-decoration:none;font-size:11px}
.nav{position:sticky;top:0;z-index:10;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);
  display:flex;gap:6px;overflow-x:auto;padding:9px 12px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.navchip{flex:0 0 auto;font-size:12px;font-weight:650;color:var(--mut);text-decoration:none;padding:6px 11px;border:1px solid var(--gbrd);border-radius:999px;white-space:nowrap}
.navchip.active{color:var(--ink);background:rgba(156,195,255,.14);border-color:var(--info-ink)}
.card{max-width:680px;margin:11px auto;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;user-select:none}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.dot.green{background:var(--pos-ink)}.dot.red{background:var(--neg-ink)}
.dot.amber{background:var(--warn-ink)}.dot.blue{background:var(--info-ink)}.dot.grey{background:var(--dim)}
.ctitle{font-weight:700;font-size:13.5px;flex:0 0 auto}
.csum{color:var(--mut);font-size:11.5px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{color:var(--mut);transition:transform .15s;flex:0 0 auto}.card.open .caret{transform:rotate(90deg)}
.cbody{display:none;padding:0 14px 14px}.card.open .cbody{display:block}
.live{background:rgba(156,195,255,.06);border:1px solid rgba(156,195,255,.2);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
.lnow{font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--info-ink);border:1px solid var(--info-ink);border-radius:5px;padding:1px 5px;margin-right:6px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--mut)}
.px{font-size:22px;font-weight:700;margin:2px 0 8px}.chip{font-size:10px;border-radius:6px;padding:1px 6px;vertical-align:middle}
.chip.live{color:var(--pos-ink);border:1px solid var(--pos-ink)}.chip.dly{color:var(--warn-ink);border:1px solid var(--warn-ink)}
.setup{font-size:12px;background:rgba(255,255,255,.02);border:1px solid var(--gbrd);border-radius:8px;padding:8px 10px;margin-top:7px;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.trainer{margin-top:11px;border-top:1px dashed var(--gbrd);padding-top:7px}
.trainer>summary{cursor:pointer;color:var(--info-ink);font-size:12px;font-weight:650}
.hp{font-size:11.5px;color:var(--mut);line-height:1.55;margin-top:6px}.hp b{color:var(--ink)}
.hp.how{color:var(--pos-ink)}.hp.how b{color:var(--pos-ink)}.hp.cav{color:var(--warn-ink);font-size:11px}
.foot{max-width:680px;margin:14px auto;padding:0 14px;font-size:10.5px;color:var(--dim);line-height:1.5}
.loading{color:var(--mut);font-size:12px;padding:8px 0}
</style></head><body>
<div class="hd"><h1>Arsenal Dashboard <span class="mut" style="font-size:12px">· Trader Trainer</span></h1>
<div class="sub">single page · tap a chip to jump · cards auto-expand when something's live · <a href="index.html">full dashboard ▸</a></div></div>
<nav class="nav" id="nav"></nav>
<div id="page"></div>
<div class="foot" id="foot">Loading live feeds…</div>
<script>
const HELP={"regime": {"t": "Regime label (coincident)", "w": "A blended read of how the tape is moving RIGHT NOW \u2014 ADX (trend strength), Choppiness Index, Kaufman Efficiency Ratio, and recent EMA-cross count \u2014 into one label (TRENDING / TRANSITIONAL / CHOP) plus a 0-100 trendiness score.", "r": "Green TRENDING (high score) = clean directional moves; grey CHOP (low) = whippy/range-bound; amber TRANSITIONAL = mixed/turning.", "u": "A sizing + expectation backdrop: CHOP -> size down, fade extremes, expect whipsaw; TRENDING -> normal size, follow, hold winners.", "c": "\u26a0 COINCIDENT \u2014 it describes the regime you are IN now, NOT a forecast of the next one. Direction-forecasting is the fluke the engine exists to catch. Context only, never a signal."}, "internals": {"t": "Internals (TICK / TRIN / ADD / ADSPD)", "w": "Real-time breadth gauges of the broad US stock market: how many stocks tick up vs down, volume balance, and advancers minus decliners.", "r": "TICK: \u00b1400 = chop/neutral, \u00b1700 = a real trend push, \u00b11000 = an extreme (watch for exhaustion). TRIN: below 1 leans bullish, above 1 bearish. ADD/ADSPD: net advancers \u2014 positive = broad buying.", "u": "These are TIMING/confirmation, not direction-pickers \u2014 they tell you whether the tape supports a move, not which way to bet.", "c": "\u26a0 Regular-session and index-level only (no overnight, not per-stock). When STALE / N-A, ignore them. Extremes can persist \u2014 \u00b11000 is not an automatic fade."}, "proscreen": {"t": "Pro Screener (v2) \u2014 SHADOW education tab", "w": "A ground-up Minervini/O'Neil/Zanger/CANSLIM screener that runs in PARALLEL to the live engine. It gates the universe hard (trend template -> liquidity -> VCP -> RS top-decile) and shows the survivors as teaching examples with the same entry/stop/target/R:R/size format as the other system panels.", "r": "The funnel shows how many names survive each gate (most die early \u2014 that's the point). Qualified setups show the pro structure. SHADOW = it logs forward picks to prove itself vs the current engine; it is NOT a live recommendation.", "u": "Learn how a disciplined pro screen structures a trade: tight VCP base, strongest RS, entry at the pivot (not chased), structural stop, measured-move target. Watch the funnel \u2014 pros sit in cash when nothing passes.", "c": "\u26a0 SHADOW / educational \u2014 NOT a trade signal. REAL data only (synthetic/test data is never shown). Promotion to live requires n\u226530 forward beating the current engine + haircut + go. n<30 DESCRIPTIVE."}, "dxy": {"t": "GC / DXY overlay (SHADOW)", "w": "The dollar (DXY) and gold usually move INVERSELY; pros use DXY as a confirm/veto on gold \u2014 but only when the rolling correlation is actually negative.", "r": "corr \u2264 \u22120.40 = INVERSE (trust the dollar read). DXY up = gold headwind. DECOUPLED/POSITIVE = the inverse broke; ignore DXY, lean on gold's own structure.", "u": "Context + veto on GC setups \u2014 never an entry on its own.", "c": "\u26a0 INFORMATIONAL / SHADOW \u2014 not a validated signal. Regime-dependent; earns voting status only on n\u226530 forward + haircut."}, "orb": {"t": "Futures ORB (MES/MNQ/MGC/MCL) \u2014 SHADOW, DELAYED", "w": "Opening-range breakouts on the futures you day-trade. The full-size is the read; trade the micro for sizing. Polygon futures are DELAYED ~10-15min \u2014 context, confirm on your live ToS feed.", "r": "RAW = 30-min OR break + 1.5\u00d7 vol (control). A+ = RAW + daily bias agrees + index regime TRENDING + range OK + not-extended. ES/NQ ~85-90% correlated = ONE risk.", "u": "See which futures broke their opening range and whether confluence backs it \u2014 never an entry on its own.", "c": "\u26a0 DELAYED context, not a live trigger. A+ = confluence filter, not a validated win rate \u2014 earns status only on n\u226530 forward (per instrument) + haircut."}, "regime_how": "Don't trade the regime \u2014 trade WITH it. CHOP: downsize, fade extremes, expect reversion. TRENDING: normal size, follow pullbacks. TRANSITIONAL: smaller, wait for it to resolve.", "internals_how": "Use ES live price + breadth as CONFIRMATION, not direction. Wait for a 5-min close through a structure level \u2014 the break is the trigger, not the number. Long only above the reclaim; stop beyond the swept wick.", "proscreen_how": "If a name clears the funnel: buy the breakout ABOVE the pivot (a buy-stop), stop below the base low, target the measured move. Don't chase if extended. SHADOW \u2014 paper only.", "dxy_how": "Use it as a SIZE/conviction tweak on a gold setup you already have: dollar breaking down + corr inverse = lean in; dollar rallying against your gold long = half-size or skip. Never an entry by itself.", "orb_how": "Wait for the 5-min OR break to confirm on your LIVE ToS feed (the dashboard is delayed). A+ = full confluence; RAW = control. Entry at the broken edge, stop opposite edge, T1 1R. One per instrument per day."};
const API_BASE="https://raw.githubusercontent.com/hbout56-arsenal/arsenal-dashboard-public/main/";
async function ghFetch(f){try{const r=await fetch(API_BASE+f+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return await r.json();}catch(e){return null;}}
function esc(s){return s==null?"":String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function ageMin(iso){const t=Date.parse(String(iso||"").replace(" ET",""));return isNaN(t)?null:(Date.now()-t)/60000;}

// ── per-section renderers: each returns {nav,title,dot,summary,active,bodyHTML,now,helpKey} ──
function rRegime(d){
  if(!d||!d.instruments)return null;
  const I=d.instruments,spy=I.SPY_daily_proxy||{},lab=spy.label||"?",tr=spy.trendiness;
  const dot=lab==="TRENDING"?"green":(lab==="CHOP"?"grey":"amber");
  const body=Object.entries(I).map(([k,v])=>'<div class="kv"><span>'+esc(k.replace(/_/g," "))+'</span><b>'+esc(v.label)+' <span class="mut">'+esc(v.trendiness)+'/100</span></b></div>').join("");
  const now="SPY regime <b>"+esc(lab)+"</b> (trendiness "+esc(tr)+"/100) — "+(lab==="CHOP"?"whippy/range-bound: downsize, fade extremes":(lab==="TRENDING"?"clean trend: normal size, follow pullbacks":"mixed/turning: smaller, wait for it to resolve"))+". Context only — regime never votes.";
  return {nav:"Regime",title:"Market Regime (coincident)",dot,summary:"SPY "+lab+" ("+tr+")",active:true,bodyHTML:body,now,helpKey:"regime"};
}
function rES(snap,pf){
  let es=null,age=null,src="";
  if(snap&&snap.rows&&snap.rows.length){const r=snap.rows[snap.rows.length-1];const v=parseFloat(r.es_last);age=snap.pushed_at?(Date.now()-Date.parse(snap.pushed_at))/60000:null;
    if(!isNaN(v)&&age!=null&&age<10){es=v;src="LIVE (IQFeed)";}}
  if(es==null&&pf&&pf.symbols&&pf.symbols.ES){es=pf.symbols.ES.price;src="DELAYED (Polygon)";age=pf.symbols.ES.as_of_ms?(Date.now()-pf.symbols.ES.as_of_ms)/60000:null;}
  if(es==null)return null;
  const live=/LIVE/.test(src),chip='<span class="chip '+(live?"live":"dly")+'">'+(live?"● ":"")+src+'</span>';
  const body='<div class="px">'+esc(es)+' '+chip+'</div><div class="kv"><span>updated</span><b class="mut">'+(age!=null?Math.round(age)+"m ago":"n/a")+'</b></div><div class="kv"><span>paper setup</span><b class="mut">none active — watching structure</b></div>';
  const now="ES <b>"+esc(es)+"</b> "+src+". No active paper trigger — wait for a 5-min close through a structure level; the break is the trigger, not the number.";
  return {nav:"ES / Futures",title:"ES — live price & status",dot:live?"green":"amber",summary:"ES "+es+" · "+src,active:true,bodyHTML:body,now,helpKey:"internals"};
}
function rScreener(d){
  if(!d||!d.funnel)return null;const f=d.funnel,q=(d.qualified||[]),n=f.stage4_top||0,t=q[0]||{};
  const body='<div class="kv"><span>funnel</span><b>'+esc(f.universe)+'→'+esc(f.stage1_trend_template)+'→'+esc(f.stage2_liquidity)+'(liq)→'+esc(f.stage3_vcp)+'(vcp)→'+esc(n)+'(rs)</b></div>'
    +'<div class="kv"><span>liquidity gate</span><b>'+esc(f.stage2_liquidity_passed)+' passed / '+esc(f.stage2_liquidity_failed)+' failed (≥$20M)</b></div>'
    +(n?'<div class="setup">'+esc(t.ticker)+(t.is_etf?' (ETF)':'')+' · entry '+esc(t.entry)+' · stop '+esc(t.stop)+' · target '+esc(t.target)+' · ADV $'+Math.round((t.adv||0)/1e6)+'M</div>':'');
  const now=n?("<b>"+n+"</b> name clears the full funnel: <b>"+esc(t.ticker)+"</b>, ADV $"+Math.round((t.adv||0)/1e6)+"M, RS top-decile. Trigger = a break ABOVE the "+esc(t.entry)+" pivot, NOT its presence here. SHADOW · n<30 → ACCRUING."):"No name clears the full funnel today — pros sit in cash when nothing passes. SHADOW · educational.";
  return {nav:"Screener",title:"Pro Screener v2 (SHADOW)",dot:n?"blue":"grey",summary:n?(n+" qualified · "+esc(t.ticker)):"0 qualified · cash",active:!!n,bodyHTML:body,now,helpKey:"proscreen"};
}
function rDXY(d){
  if(!d||!d.snapshot)return null;const s=d.snapshot;const inv=s.regime==="INVERSE";
  const body='<div class="kv"><span>corr 20d / 60d</span><b>'+esc(s.corr20)+' / '+esc(s.corr60)+' <span class="mut">'+esc(s.regime)+'</span></b></div><div class="kv"><span>DXY trend · real yields</span><b>'+esc(s.dxy_trend)+' · '+esc(s.real_yield)+'</b></div>';
  const now="Dollar is <b>"+esc(s.dxy_trend)+"</b> and "+esc(s.regime)+" to gold (corr "+esc(s.corr60)+") → "+(s.dxy_trend==="UP"?"headwind for gold longs":"tailwind for gold longs")+". CONTEXT / veto only — not a validated signal.";
  return {nav:"GC / DXY",title:"GC / DXY overlay (SHADOW)",dot:"grey",summary:"corr "+s.corr60+" "+s.regime+" · DXY "+s.dxy_trend,active:false,bodyHTML:body,now,helpKey:"dxy"};
}
function rORB(d){
  if(!d)return null;const tr=(d.triggers||[]),nA=d.aplus_triggers||0,nR=d.raw_triggers||0;
  const body=(tr.length?tr.map(t=>'<div class="setup">'+esc(t.micro)+' '+esc(t.side)+' <b style="color:'+(t.aplus?"var(--pos-ink)":"var(--mut)")+'">'+(t.aplus?"A+":"RAW")+'</b> · OR '+esc(t.or_window_et)+' · entry '+esc(t.entry)+' · stop '+esc(t.stop)+' · DELAYED</div>').join(""):'<div class="kv grey"><span class="mut">no opening-range breakout this session</span></div>');
  const now=nR?("<b>"+nR+"</b> RAW / <b>"+nA+"</b> A+ futures breakouts today (DELAYED ~10-15min). Confirm the break on your LIVE ToS feed — the dashboard lags. A+ = confluence, not a validated win rate."):"No futures opening-range breakout this session. DELAYED context only.";
  return {nav:"Futures ORB",title:"Futures ORB (SHADOW · DELAYED)",dot:nA?"green":(nR?"amber":"grey"),summary:nR+" RAW / "+nA+" A+",active:!!nR,bodyHTML:body,now,helpKey:"orb"};
}

function helpBlock(k){const h=HELP[k];if(!h)return"";const how=HELP[k+"_how"];
  return '<details class="trainer"><summary>ℹ How to read / use / trade this</summary>'
   +'<div class="hp"><b>What it is.</b> '+esc(h.w)+'</div><div class="hp"><b>How to read it.</b> '+esc(h.r)+'</div>'
   +"<div class=\"hp\"><b>How you’d use it.</b> "+esc(h.u)+"</div>"
   +(how?'<div class="hp how"><b>▸ HOW TO TRADE THIS.</b> '+esc(how)+'</div>':"")
   +'<div class="hp cav">'+esc(h.c)+'</div></details>';}

function cardHTML(s,i){
  return '<section id="sec'+i+'" class="card'+(s.active?' open':'')+'">'
   +'<div class="chead" onclick="this.parentElement.classList.toggle(\'open\')">'
   +'<span class="dot '+s.dot+'"></span><span class="ctitle">'+esc(s.title)+'</span>'
   +'<span class="csum">'+esc(s.summary)+'</span><span class="caret">▸</span></div>'
   +'<div class="cbody"><div class="live"><span class="lnow">NOW</span> '+s.now+'</div><div class="data">'+s.bodyHTML+'</div>'+helpBlock(s.helpKey)+'</div></section>';
}

async function load(){
  const [rl,snap,pf,sv,dx,orb]=await Promise.all([
    ghFetch("regime_label.json"),ghFetch("internals_snapshot.json"),ghFetch("prices_futures.json"),
    ghFetch("screener_v2_funnel.json"),ghFetch("dxy_overlay.json"),ghFetch("orb_futures.json")]);
  const secs=[rRegime(rl),rES(snap,pf),rScreener(sv),rORB(orb),rDXY(dx)].filter(Boolean);
  document.getElementById("page").innerHTML=secs.map(cardHTML).join("");
  document.getElementById("nav").innerHTML=secs.map((s,i)=>'<a class="navchip" href="#sec'+i+'" data-sec="sec'+i+'">'+esc(s.nav)+'</a>').join("");
  const chips=Object.fromEntries([...document.querySelectorAll(".navchip")].map(c=>[c.dataset.sec,c]));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){Object.values(chips).forEach(c=>c.classList.remove("active"));(chips[e.target.id]||{}).classList&&chips[e.target.id].classList.add("active");}}),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section.card").forEach(s=>io.observe(s));
  document.getElementById("foot").innerHTML="Live feeds (Polygon/IQFeed) · futures exchange-delayed · for live execution prices use ToS. Informational/SHADOW panels never vote; price breaking a level is the trigger, not the indicator. n&lt;30 = descriptive. No $/positions shown. · updated "+new Date().toLocaleTimeString();
}
function rth(){try{const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",hour12:false}).formatToParts(new Date());let dow,h;p.forEach(x=>{if(x.type=="weekday")dow=x.value;if(x.type=="hour")h=+x.value;});return["Mon","Tue","Wed","Thu","Fri"].includes(dow)&&h>=9&&h<16;}catch(e){return false;}}
function loop(){load();setTimeout(loop,rth()?75000:300000);}
loop();
</script></body></html>
